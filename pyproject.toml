[project]
name = "fastapi-rate-limiter-plugin"
version = "0.1.0"
description = "Redis backed rate limiting dependency for FastAPI and Starlette"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bb-soft", email = "noreply@k1core.tech" },
]
requires-python = ">=3.12"
keywords = ["fastapi", "starlette", "rate-limit", "throttling", "redis"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "redis>=5",
    "starlette>=0.37",
]

[project.urls]
Repository = "https://github.com/k1core-ltd/fastapi-rate-limiter"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fastapi_rate_limiter"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["UP", "E", "W", "I", "N", "ANN", "B", "C4", "RET", "SIM", "TID"]
