[project]
name = "fastapi-rate-limiter"
version = "0.1.0"
description = "Redis backed rate limiting dependency for FastAPI and Starlette"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["fastapi", "starlette", "rate-limit", "throttling", "redis"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "redis>=5",
    "starlette>=0.37",
]

[project.urls]
Repository = "https://github.com/k1core-ltd/fastapi-rate-limiter"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["UP", "E", "W", "I", "N", "ANN", "B", "C4", "RET", "SIM", "TID"]
